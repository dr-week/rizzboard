<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Vignette & Gradients -->
    <radialGradient id="stampBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#C2272D" />
      <stop offset="70%" stop-color="#9E1B20" />
      <stop offset="100%" stop-color="#6E0E12" />
    </radialGradient>

    <linearGradient id="innerCreamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8" />
      <stop offset="100%" stop-color="#F2E6C9" />
    </linearGradient>

    <linearGradient id="jungleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B2B" />
      <stop offset="50%" stop-color="#2D5A3C" />
      <stop offset="100%" stop-color="#E59B37" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A2E17" />
      <stop offset="50%" stop-color="#3D1D0E" />
      <stop offset="100%" stop-color="#261007" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7BA8B" />
      <stop offset="100%" stop-color="#E29662" />
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E84393" />
      <stop offset="100%" stop-color="#B8256F" />
    </linearGradient>

    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8854D0" />
      <stop offset="100%" stop-color="#57289E" />
    </linearGradient>

    <linearGradient id="keycapLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DCDDE1" />
    </linearGradient>

    <linearGradient id="keycapDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7158A6" />
      <stop offset="100%" stop-color="#4B3869" />
    </linearGradient>

    <linearGradient id="boardCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0DACB" />
      <stop offset="100%" stop-color="#C2BAA6" />
    </linearGradient>

    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Stamp Perforation Mask/Pattern -->
    <mask id="stampPerforationMask">
      <rect width="800" height="800" fill="white" />
      <!-- Top & Bottom Perforations -->
      <!-- Iterated circle cuts along edges -->
    </mask>
  </defs>

  <!-- Base Red Outer Frame -->
  <rect width="800" height="800" rx="36" fill="url(#stampBgGrad)" />

  <!-- Outer Filigree Accents (Top-Left, Top-Right, Bottom-Left, Bottom-Right) -->
  <g stroke="#6E0E12" stroke-width="4" fill="none" opacity="0.75">
    <path d="M 30,30 Q 80,30 80,80 Q 30,80 30,30 Z" />
    <path d="M 40,40 Q 65,40 65,65 Q 40,65 40,40 Z" />
    <path d="M 770,30 Q 720,30 720,80 Q 770,80 770,30 Z" />
    <path d="M 760,40 Q 735,40 735,65 Q 760,65 760,40 Z" />
    <path d="M 30,770 Q 80,770 80,720 Q 30,720 30,770 Z" />
    <path d="M 40,760 Q 65,760 65,735 Q 40,735 40,760 Z" />
    <path d="M 770,770 Q 720,770 720,720 Q 770,720 770,770 Z" />
    <path d="M 760,760 Q 735,760 735,735 Q 760,735 760,760 Z" />
  </g>

  <!-- Perforated Postal Stamp Border Shape -->
  <g filter="url(#stampShadow)">
    <!-- Stamp White / Cream Card -->
    <path d="
      M 70,70
      L 730,70
      L 730,730
      L 70,730
      Z
    " fill="url(#innerCreamGrad)" stroke="#E5D3B3" stroke-width="6" />

    <!-- Stamp Teeth Emulation (Decorative Scallop Rings) -->
    <!-- Top & Bottom Tooth Beads -->
    <g fill="#9E1B20">
      <!-- Top Scallop Cuts -->
      <circle cx="110" cy="70" r="14" /><circle cx="150" cy="70" r="14" /><circle cx="190" cy="70" r="14" />
      <circle cx="230" cy="70" r="14" /><circle cx="270" cy="70" r="14" /><circle cx="310" cy="70" r="14" />
      <circle cx="350" cy="70" r="14" /><circle cx="390" cy="70" r="14" /><circle cx="430" cy="70" r="14" />
      <circle cx="470" cy="70" r="14" /><circle cx="510" cy="70" r="14" /><circle cx="550" cy="70" r="14" />
      <circle cx="590" cy="70" r="14" /><circle cx="630" cy="70" r="14" /><circle cx="670" cy="70" r="14" />

      <!-- Bottom Scallop Cuts -->
      <circle cx="110" cy="730" r="14" /><circle cx="150" cy="730" r="14" /><circle cx="190" cy="730" r="14" />
      <circle cx="230" cy="730" r="14" /><circle cx="270" cy="730" r="14" /><circle cx="310" cy="730" r="14" />
      <circle cx="350" cy="730" r="14" /><circle cx="390" cy="730" r="14" /><circle cx="430" cy="730" r="14" />
      <circle cx="470" cy="730" r="14" /><circle cx="510" cy="730" r="14" /><circle cx="550" cy="730" r="14" />
      <circle cx="590" cy="730" r="14" /><circle cx="630" cy="730" r="14" /><circle cx="670" cy="730" r="14" />

      <!-- Left Scallop Cuts -->
      <circle cx="70" cy="110" r="14" /><circle cx="70" cy="150" r="14" /><circle cx="70" cy="190" r="14" />
      <circle cx="70" cy="230" r="14" /><circle cx="70" cy="270" r="14" /><circle cx="70" cy="310" r="14" />
      <circle cx="70" cy="350" r="14" /><circle cx="70" cy="390" r="14" /><circle cx="70" cy="430" r="14" />
      <circle cx="70" cy="470" r="14" /><circle cx="70" cy="510" r="14" /><circle cx="70" cy="550" r="14" />
      <circle cx="70" cy="590" r="14" /><circle cx="70" cy="630" r="14" /><circle cx="70" cy="670" r="14" />

      <!-- Right Scallop Cuts -->
      <circle cx="730" cy="110" r="14" /><circle cx="730" cy="150" r="14" /><circle cx="730" cy="190" r="14" />
      <circle cx="730" cy="230" r="14" /><circle cx="730" cy="270" r="14" /><circle cx="730" cy="310" r="14" />
      <circle cx="730" cy="350" r="14" /><circle cx="730" cy="390" r="14" /><circle cx="730" cy="430" r="14" />
      <circle cx="730" cy="470" r="14" /><circle cx="730" cy="510" r="14" /><circle cx="730" cy="550" r="14" />
      <circle cx="730" cy="590" r="14" /><circle cx="730" cy="630" r="14" /><circle cx="730" cy="670" r="14" />
    </g>

    <!-- Inner Illustration Viewport -->
    <rect x="95" y="95" width="610" height="610" rx="4" fill="url(#jungleGrad)" stroke="#1F1A17" stroke-width="10" />
  </g>

  <!-- Jungle Background Foliage & Golden Stars -->
  <g>
    <!-- Background Leaves & Vines -->
    <path d="M 100,100 Q 200,180 140,320 Q 100,240 100,100 Z" fill="#1B4D2E" opacity="0.8" />
    <path d="M 690,120 Q 580,220 630,360 Q 690,260 690,120 Z" fill="#1B4D2E" opacity="0.8" />
    <path d="M 110,480 Q 220,520 120,680 Q 95,600 110,480 Z" fill="#C06C28" opacity="0.6" />
    <path d="M 680,480 Q 580,540 680,680 Z" fill="#2E6A3E" opacity="0.7" />

    <!-- Golden Hanging Stars -->
    <!-- Star Top-Left -->
    <polygon points="160,150 166,168 184,168 170,179 175,196 160,185 145,196 150,179 136,168 154,168" fill="#F9CA24" stroke="#B78103" stroke-width="2" />
    <polygon points="225,120 228,131 240,131 230,138 234,149 225,142 216,149 220,138 210,131 222,131" fill="#F9CA24" stroke="#B78103" stroke-width="1.5" />
    <!-- Star Right -->
    <polygon points="660,260 666,278 684,278 670,289 675,306 660,295 645,306 650,289 636,278 654,278" fill="#F9CA24" stroke="#B78103" stroke-width="2" />
  </g>

  <!-- Character: Backpack & Shoulders -->
  <g id="characterBase">
    <!-- Purple Explorer Backpack Straps & Pack -->
    <path d="M 210,500 C 190,560 195,670 240,700 C 270,720 290,650 280,560 Z" fill="url(#strapGrad)" stroke="#1F1A17" stroke-width="8" />
    <path d="M 590,500 C 610,560 605,670 560,700 C 530,720 510,650 520,560 Z" fill="url(#strapGrad)" stroke="#1F1A17" stroke-width="8" />

    <!-- Pink Explorer T-Shirt -->
    <path d="M 250,550 Q 400,620 550,550 L 590,700 L 210,700 Z" fill="url(#shirtGrad)" stroke="#1F1A17" stroke-width="8" />
    <!-- Shirt Collar -->
    <path d="M 330,550 Q 400,590 470,550" fill="none" stroke="#9E1B20" stroke-width="6" />

    <!-- Neck -->
    <path d="M 360,490 L 440,490 L 440,555 Q 400,575 360,555 Z" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="8" />
  </g>

  <!-- Character: Head & Iconic Smug/Rizz Expression -->
  <g id="characterHead">
    <!-- Face Contour -->
    <path d="
      M 240,380
      C 220,480 320,540 400,540
      C 480,540 580,480 560,380
      C 550,290 490,270 400,270
      C 310,270 250,290 240,380 Z
    " fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="9" />

    <!-- Iconic Bob Haircut -->
    <path d="
      M 220,380
      C 210,240 280,140 400,135
      C 520,140 590,240 580,380
      C 585,450 565,510 540,520
      C 525,430 540,360 520,320
      C 490,340 460,340 435,320
      C 420,345 380,345 365,320
      C 340,345 305,340 280,320
      C 260,360 275,430 260,520
      C 235,510 215,450 220,380 Z
    " fill="url(#hairGrad)" stroke="#1F1A17" stroke-width="9" />

    <!-- Bang Highlights / Hair Sheen -->
    <path d="M 320,220 Q 400,200 480,220" stroke="#7A4222" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Eyebrows (Left Raised / Right Smug Arch) -->
    <!-- Left Arched Eyebrow (Confidence / Smug) -->
    <path d="M 320,325 Q 365,295 405,325" fill="none" stroke="#261007" stroke-width="7" stroke-linecap="round" />
    <!-- Right Sassy Raised Arch -->
    <path d="M 430,320 Q 475,280 515,310" fill="none" stroke="#261007" stroke-width="7" stroke-linecap="round" />

    <!-- Smug / Seductive Eyes (Heavy-Lidded Half-Closed Rizz Eyes) -->
    <!-- Left Eye -->
    <g>
      <path d="M 315,370 Q 365,345 400,380 Q 360,405 315,370 Z" fill="#FFFFFF" stroke="#1F1A17" stroke-width="6" />
      <ellipse cx="365" cy="375" rx="20" ry="16" fill="#6B331A" />
      <circle cx="365" cy="375" r="9" fill="#000000" />
      <circle cx="370" cy="371" r="4" fill="#FFFFFF" />
      <!-- Heavy Upper Eyelid -->
      <path d="M 310,368 Q 365,340 405,375" fill="none" stroke="#1F1A17" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Right Eye (Slight Wink / Knowing Glance) -->
    <g>
      <path d="M 435,375 Q 475,340 520,368 Q 475,405 435,375 Z" fill="#FFFFFF" stroke="#1F1A17" stroke-width="6" />
      <ellipse cx="475" cy="375" rx="20" ry="16" fill="#6B331A" />
      <circle cx="475" cy="375" r="9" fill="#000000" />
      <circle cx="480" cy="371" r="4" fill="#FFFFFF" />
      <!-- Heavy Upper Eyelid -->
      <path d="M 430,373 Q 475,335 525,366" fill="none" stroke="#1F1A17" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Nose -->
    <path d="M 410,395 Q 425,415 410,425 Q 395,425 400,415" fill="none" stroke="#B86E3C" stroke-width="5" stroke-linecap="round" />

    <!-- The Trademark Asymmetric Smirk (Half-Smile) -->
    <g>
      <!-- Shadow Under Lip -->
      <path d="M 380,485 Q 420,500 460,480" stroke="#B86E3C" stroke-width="5" fill="none" stroke-linecap="round" />
      <!-- Mouth Shape With Flirty Grin -->
      <path d="M 350,460 Q 405,465 480,445 Q 440,495 350,460 Z" fill="#3D1D0E" stroke="#1F1A17" stroke-width="6" />
      <!-- Pearly White Teeth Strip -->
      <path d="M 360,463 Q 410,468 472,450 Q 430,475 360,463 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Mechanical Keyboard & Hands -->
  <g id="mechanicalKeyboardAndHands">
    <!-- Retro Custom Mechanical Keyboard Chassis -->
    <g transform="rotate(-3, 400, 670)">
      <!-- Keyboard Base / High-Profile Case -->
      <rect x="180" y="600" width="440" height="150" rx="16" fill="url(#boardCaseGrad)" stroke="#1F1A17" stroke-width="8" />
      <!-- Keyboard Plate Recess -->
      <rect x="195" y="612" width="410" height="120" rx="8" fill="#2D2B30" stroke="#1F1A17" stroke-width="4" />

      <!-- Custom Keycaps: Row 1 (Numbers / Functions) -->
      <g fill="url(#keycapLight)" stroke="#1F1A17" stroke-width="2.5" rx="3">
        <rect x="205" y="618" width="24" height="20" fill="url(#keycapDark)" />
        <rect x="233" y="618" width="22" height="20" /><rect x="259" y="618" width="22" height="20" />
        <rect x="285" y="618" width="22" height="20" /><rect x="311" y="618" width="22" height="20" />
        <rect x="337" y="618" width="22" height="20" /><rect x="363" y="618" width="22" height="20" />
        <rect x="389" y="618" width="22" height="20" /><rect x="415" y="618" width="22" height="20" />
        <rect x="441" y="618" width="22" height="20" /><rect x="467" y="618" width="22" height="20" />
        <rect x="493" y="618" width="22" height="20" /><rect x="519" y="618" width="22" height="20" />
        <rect x="545" y="618" width="48" height="20" fill="url(#keycapDark)" />
      </g>

      <!-- Keycaps: Row 2 (QWERTY) -->
      <g fill="url(#keycapLight)" stroke="#1F1A17" stroke-width="2.5">
        <rect x="205" y="642" width="34" height="22" fill="url(#keycapDark)" />
        <rect x="243" y="642" width="22" height="22" /><rect x="269" y="642" width="22" height="22" />
        <rect x="295" y="642" width="22" height="22" /><rect x="321" y="642" width="22" height="22" />
        <rect x="347" y="642" width="22" height="22" /><rect x="373" y="642" width="22" height="22" />
        <rect x="399" y="642" width="22" height="22" /><rect x="425" y="642" width="22" height="22" />
        <rect x="451" y="642" width="22" height="22" /><rect x="477" y="642" width="22" height="22" />
        <rect x="503" y="642" width="22" height="22" /><rect x="529" y="642" width="22" height="22" />
        <rect x="555" y="642" width="38" height="22" fill="url(#keycapDark)" />
      </g>

      <!-- Keycaps: Row 3 (ASDF) -->
      <g fill="url(#keycapLight)" stroke="#1F1A17" stroke-width="2.5">
        <rect x="205" y="668" width="42" height="22" fill="url(#keycapDark)" />
        <rect x="251" y="668" width="22" height="22" /><rect x="277" y="668" width="22" height="22" />
        <rect x="303" y="668" width="22" height="22" /><rect x="329" y="668" width="22" height="22" />
        <rect x="355" y="668" width="22" height="22" /><rect x="381" y="668" width="22" height="22" />
        <rect x="407" y="668" width="22" height="22" /><rect x="433" y="668" width="22" height="22" />
        <rect x="459" y="668" width="22" height="22" /><rect x="485" y="668" width="22" height="22" />
        <rect x="511" y="668" width="22" height="22" />
        <rect x="537" y="668" width="56" height="22" fill="#E84393" /> <!-- Accent Enter -->
      </g>

      <!-- Keycaps: Row 4 (Spacebar Row) -->
      <g fill="url(#keycapLight)" stroke="#1F1A17" stroke-width="2.5">
        <rect x="205" y="694" width="36" height="24" fill="url(#keycapDark)" />
        <rect x="245" y="694" width="30" height="24" fill="url(#keycapDark)" />
        <rect x="279" y="694" width="30" height="24" />
        <rect x="313" y="694" width="160" height="24" fill="url(#keycapDark)" /> <!-- Spacebar -->
        <rect x="477" y="694" width="30" height="24" />
        <rect x="511" y="694" width="36" height="24" fill="url(#keycapDark)" />
        <rect x="551" y="694" width="42" height="24" fill="url(#keycapDark)" />
      </g>

      <!-- Custom Aviator / Coiled Cable Connector -->
      <rect x="585" y="675" width="26" height="12" rx="3" fill="#636E72" stroke="#1F1A17" stroke-width="2" />
      <path d="M 610,681 Q 650,681 660,710" fill="none" stroke="#2D3436" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Typing Hands (Hovering Over Keys with Mastery) -->
    <!-- Left Hand & Curved Fingers -->
    <g>
      <!-- Arm -->
      <path d="M 270,640 Q 340,650 370,610 Q 340,580 270,600 Z" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="7" />
      <!-- Fingers Pressed on Keys -->
      <ellipse cx="385" cy="620" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(-15, 385, 620)" />
      <ellipse cx="405" cy="626" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(-5, 405, 626)" />
      <ellipse cx="425" cy="635" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(10, 425, 635)" />
      <ellipse cx="445" cy="648" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(25, 445, 648)" />
      <path d="M 360,630 Q 380,660 410,665" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round" /> <!-- Thumb -->
    </g>

    <!-- Right Hand Typing -->
    <g>
      <!-- Arm -->
      <path d="M 530,640 Q 460,650 430,610 Q 460,580 530,600 Z" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="7" />
      <!-- Fingers -->
      <ellipse cx="495" cy="618" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(15, 495, 618)" />
      <ellipse cx="515" cy="626" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(5, 515, 626)" />
      <ellipse cx="535" cy="635" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(-10, 535, 635)" />
      <ellipse cx="555" cy="648" rx="14" ry="9" fill="url(#skinGrad)" stroke="#1F1A17" stroke-width="4" transform="rotate(-25, 555, 648)" />
      <path d="M 540,630 Q 520,660 490,665" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linecap="round" /> <!-- Thumb -->
    </g>
  </g>
</svg>
