name: Deploy Showcase & Download Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-gh-pages:
    name: Build Latest APK & Deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Signed APK, Extension & Web Download Portal
        run: node scripts/verify/verify-all.mjs

      - name: Deploy web/dist to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TMP_DIR=$(mktemp -d)
          cp -r web/dist/* "$TMP_DIR/"
          touch "$TMP_DIR/.nojekyll"
          git fetch origin gh-pages || true
          git checkout --orphan gh-pages-deploy
          git rm -rf . > /dev/null 2>&1 || true
          cp -r "$TMP_DIR"/* .
          cp "$TMP_DIR/.nojekyll" .
          git add -A
          git commit -m "docs(portal): auto-deploy latest APK & web portal from main"
          git push origin gh-pages-deploy:gh-pages -f
